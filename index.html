<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4E7D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vergießmeinnicht">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vergießmeinnicht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- Papierschnitt: weicher Schatten unter jeder Lage -->
  <filter id="lage" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B2E24" flood-opacity=".24"/></filter>
</defs></svg>
<main id="app">
  <section id="heute" class="view">
    <div id="scene"></div>
    <header class="hud">
      <button id="tag" type="button" class="hud-main"><b id="ml">0 ml</b><span class="hud-row"><span id="sub"></span><span id="stage" class="stage"></span></span></button>
    </header>
    <p id="say" class="bubble" aria-live="polite"></p>
    <div id="drops" class="drops" role="group" aria-label="Trinken eintragen"></div>
    <button id="undo" type="button" class="undo" aria-label="Letzten Eintrag zurücknehmen" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5 3.5 9.5 8 14M4 9.5h10.5a5.5 5.5 0 0 1 0 11H10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </section>

  <section id="beet" class="view beet" hidden>
    <div class="beet-top">
    <svg id="beet-land" viewBox="0 0 330 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="beet-sky">
      <h1>Dein Beet</h1>
      <p id="beet-stats"></p>
      <p id="beet-next" class="small"></p>
      <button id="gift" type="button" class="sign" hidden>Such dir etwas aus</button>
    </div>
    </div>
    <div class="beet-ground">
      <p id="beet-empty" class="plaque">Hier wächst bald was. Heute Abend zieht deine erste Pflanze ein.</p>
      <div id="beet-rows"></div>
    </div>
  </section>

  <section id="einst" class="view page" hidden><div id="einst-body" class="page-body"></div></section>

  <nav class="nav" aria-label="Ansicht">
    <button type="button" class="tab" data-view="heute" aria-current="page">Heute</button>
    <button type="button" class="tab" data-view="beet">Beet</button>
    <button type="button" class="tab icon" data-view="einst" aria-label="Einstellungen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M19.19 10.24 L21.49 10.57 L21.49 13.43 L19.19 13.76 L18.33 15.84 L19.73 17.70 L17.70 19.73 L15.84 18.33 L13.76 19.19 L13.43 21.49 L10.57 21.49 L10.24 19.19 L8.16 18.33 L6.30 19.73 L4.27 17.70 L5.67 15.84 L4.81 13.76 L2.51 13.43 L2.51 10.57 L4.81 10.24 L5.67 8.16 L4.27 6.30 L6.30 4.27 L8.16 5.67 L10.24 4.81 L10.57 2.51 L13.43 2.51 L13.76 4.81 L15.84 5.67 L17.70 4.27 L19.73 6.30 L18.33 8.16ZM12 8.9a3.1 3.1 0 1 0 0 6.2a3.1 3.1 0 1 0 0 -6.2Z"/></svg></button>
  </nav>

  <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" type="button"></button></div>
  <dialog id="sheet" class="sheet" aria-label="Details"><div id="sheet-body"></div></dialog>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
