<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4E7D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vergießmeinnicht">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vergießmeinnicht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- Papierschnitt: weicher Schatten unter jeder Lage -->
  <filter id="lage" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B2E24" flood-opacity=".24"/></filter>
</defs></svg>
<main id="app">
  <section id="heute" class="view">
    <div id="scene"></div>
    <header class="hud">
      <button id="tag" type="button" class="hud-main"><b id="ml">0 ml</b><span class="hud-row"><span id="sub"></span><span id="stage" class="stage"></span></span></button>
    </header>
    <p id="say" class="bubble" aria-live="polite"></p>
    <div id="drops" class="drops" role="group" aria-label="Trinken eintragen"></div>
    <button id="undo" type="button" class="undo" aria-label="Letzten Eintrag zurücknehmen" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6 4 11l5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 11H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" transform="translate(0 -3)"/></svg></button>
  </section>

  <section id="beet" class="view beet" hidden>
    <div class="beet-top">
    <svg id="beet-land" viewBox="0 0 330 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="beet-sky">
      <h1>Dein Beet</h1>
      <p id="beet-stats"></p>
      <p id="beet-next" class="small"></p>
      <button id="gift" type="button" class="sign" hidden>Such dir etwas aus</button>
    </div>
    </div>
    <div class="beet-ground">
      <p id="beet-empty" class="plaque">Hier wächst bald was. Heute Abend zieht deine erste Pflanze ein.</p>
      <div id="beet-rows"></div>
    </div>
  </section>

  <section id="einst" class="view page" hidden><div id="einst-body" class="page-body"></div></section>

  <nav class="nav" aria-label="Ansicht">
    <button type="button" class="tab" data-view="heute" aria-current="page">Heute</button>
    <button type="button" class="tab" data-view="beet">Beet</button>
    <button type="button" class="tab icon" data-view="einst" aria-label="Einstellungen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8c.1.6.1 1.2 0 1.8l2 1.8-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.8a5.6 5.6 0 0 1 0-1.8l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9zM12 8.6a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8z" transform="translate(0 1)"/></svg></button>
  </nav>

  <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" type="button"></button></div>
  <dialog id="sheet" class="sheet" aria-label="Details"><div id="sheet-body"></div></dialog>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
